# =====================================================================
#  selenide.properties — ЕДИНСТВЕННЫЙ источник настроек Selenide
# =====================================================================
#
#  КАК ЭТО РАБОТАЕТ
#  ------------------------------------------------
#  Selenide САМ находит этот файл в classpath (src/test/resources) и
#  применяет значения к своей конфигурации при старте. Никакого кода
#  для чтения файла писать не нужно — достаточно положить файл рядом
#  с тестами. Класс UiConfig лишь рассказывает о нём и показывает
#  итоговые значения (см. src/test/java/ru/stepup/ui/config/UiConfig.java).
#
#  Ключи совпадают с именами полей Selenide.Configuration и имеют
#  префикс "selenide.". Полный список описан в javadoc Selenide:
#  https://selenide.org/javadocs/current/com/codeborne/selenide/Configuration.html
#
#  ПРИОРИТЕТ ЗНАЧЕНИЙ (что перекрывает что):
#    1) системные свойства -Dselenide.xxx=...  (самый высокий);
#    2) значения из ЭТОГО файла;
#    3) встроенные дефолты Selenide.
#  То есть в CI можно переопределить любую настройку из файла системным
#  свойством, не редактируя код.

# ---------------------------------------------------------------------
#  АДРЕС ПРИЛОЖЕНИЯ
# ---------------------------------------------------------------------
# baseUrl — «корень» сайта. Относительные open("/...") в тестах
# раскрываются относительно него. Default Selenide — http://localhost:8080,
# у нас сервис на 127.0.0.1:8080 — задаём явно.
selenide.baseUrl=http://127.0.0.1:8080

# ---------------------------------------------------------------------
#  БРАУЗЕР И РЕЖИМ ЗАПУСКА
# ---------------------------------------------------------------------
# Какой браузер использовать: chrome, firefox, edge, safari.
# Драйвер Selenide скачает сам (встроенный WebDriverManager).
selenide.browser=chrome

# headless = true — без графического окна (удобно на CI и для быстрых
# локальных прогонов); false — показать окно браузера «вживую».
selenide.headless=false

# Размер окна браузера (ширина x высота).
selenide.browserSize=1440x900

# ---------------------------------------------------------------------
#  ОЖИДАНИЯ (замена sleep() — Selenide сам ждёт появления элементов)
# ---------------------------------------------------------------------
# Сколько миллисекунд ждать появления/исчезновения элемента,
# прежде чем тест упадёт.
selenide.timeout=10000

# Сколько ждать полной загрузки страницы.
selenide.pageLoadTimeout=30000

# Стратегия загрузки страницы: normal (полная загрузка), eager, none.
selenide.pageLoadStrategy=normal

# ---------------------------------------------------------------------
#  ДИАГНОСТИКА ПРИ ПАДЕНИИ ТЕСТА
# ---------------------------------------------------------------------
# При ошибке Selenide автоматически делает скриншот и сохраняет
# HTML-дамп страницы — огромное подспорье при разборе падений.
selenide.screenshots=true
selenide.savePageSource=true

# Папка, куда всё это ляжет (относительно корня проекта).
selenide.reportsFolder=build/reports/tests/ui-screenshots