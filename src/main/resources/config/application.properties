# =====================================================================
#  application.properties — ОБЩИЕ настройки (дефолты для всех контуров)
# =====================================================================
#  Это «базовый» файл с наименьшим приоритетом. Значения из него
#  перекрываются (в порядке возрастания приоритета):
#    1) файлом конкретного контура  config/application-${app.env}.properties
#    2) системными свойствами JVM    -Dserver.port=9090
#    3) переменными окружения ОС     SERVER_PORT=9090
#
#  Механику приоритетов смотрим в owner-интерфейсе:
#     src/main/java/ru/stepup/config/owner/ServerConfig.java
#  Там же перечислены аннотации @Sources / @LoadPolicy / @Key.
#
#  Соглашение об именах ключей: group.name, где group — логический блок
#  (server, auth, db...), name — конкретная настройка. owner-интерфейсы
#  мапятся на ключи через @Key(...).
# =====================================================================

app.name = StepUp Config Webinar
app.version = 1.0

# ---- Сервер (базовый адрес тестового стенда) ------------------------
server.scheme = http
server.host = 127.0.0.1
server.port = 8080
server.context.path = /api/v1
server.timeout.ms = 5000
server.max.threads = 100

# Контур «по умолчанию». ВАЖНО: owner конвертирует строку в enum
# с учётом регистра (FOO != foo), поэтому значения — ЗАГЛАВНЫЕ.
server.environment = LOCAL

# ---- Авторизация -----------------------------------------------------
# ВНИМАНИЕ: это УЧЕБНЫЙ репозиторий, пароли вымышленные.
# В реальном проекте секреты в git НЕ хранят: их задают через
# переменные окружения / секретницы CI, а в файлах оставляют пусто.
auth.username = admin
auth.password = secret123
auth.roles = user, admin
auth.token.ttl.seconds = 3600
