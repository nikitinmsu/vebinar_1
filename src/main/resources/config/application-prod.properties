# =====================================================================
#  application-prod.properties — конфигурация контура PROD (продакшн)
# =====================================================================
#  Загружается при:  -Dapp.env=prod
#  Здесь НЕ храним настоящие пароли! В реальности секреты приходят
#  из переменных окружения (источник "system:env"), а файл лишь
#  подсказывает, КАКОЙ ключ они должны переопределять.
# =====================================================================

server.scheme = https
server.host = smartshop.example.com
server.port = 8443
server.timeout.ms = 1000
server.environment = PROD

auth.username = service_account
auth.password = REPLACE_ME_IN_CI
