# =====================================================================
#  owner-features.properties — «полигон» для демонстрации возможностей owner
# =====================================================================
#  Этот файл читает ТОЛЬКО демонстрационный интерфейс OwnerFeatures
#  (пакет ru.stepup.config.owner). В отличие от application*.properties,
#  здесь мы не моделируем контуры, а показываем отдельные фичи owner:
#  типы, списки, enum, @Key, переменные, свой конвертер и т.д.
# =====================================================================

# Метод, чьё имя совпадает с ключом, мапится автоматически:
appName = StepUp Config Webinar

# Базовый «хост» и «порт» — их использует переменная ниже (см. db.endpoint).
owner.features.host = localhost
owner.features.port = 3306

# Значение ключа может ССЫЛАТЬСЯ на другие ключи через ${...}.
# При чтении owner подставит значения:  localhost:3306
# (это называется «расширение переменных», variable expansion).
db.endpoint = ${owner.features.host}:${owner.features.port}

# Пример параметризованного значения: %s подставляется из аргумента метода.
# (Для простоты шаблон на латинице: java.util.Properties читается как ISO-8859-1,
# поэтому кириллицу в .properties принято хранить в виде \uXXXX-escape'ов.)
greeting.template = Welcome, %s!
