# =====================================================================
#  manual-example.properties — файл для «ручных» способов чтения
# =====================================================================
#  Этот файл используется только в примерах РУЧНОГО чтения Properties:
#    - через getResourceAsStream (ClasspathProperties),
#    - через FileInputStream      (FileProperties).
#  Классы лежат в пакете ru.stepup.config.manual.
#
#  Обратите внимание: при ручном чтении мы сами делаем всю работу —
#  открываем поток, создаём java.util.Properties, вызываем load(...),
#  а дальше вручную достаём значения и сами конвертируем их в нужный
#  тип (Integer.parseInt и т.п.). owner избавляет от этой рутины.
# =====================================================================

host = 127.0.0.1
port = 8080
username = admin
password = manual_secret
timeout.ms = 5000
