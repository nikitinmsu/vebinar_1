# =====================================================================
#  application-dev.properties — конфигурация контура DEV (локальная разработка)
# =====================================================================
#  Перекрывает только те ключи, что отличаются от общих дефолтов
#  (файл application.properties). Загружается, когда запущено с
#  системным свойством:  -Dapp.env=dev
#
#  На локальной машине в dev принято открывать браузер с окном,
#  ставить длинные таймауты и ходить на локальный сервер.
# =====================================================================

server.port = 8080
server.timeout.ms = 5000
server.environment = DEV

auth.username = admin
auth.password = dev_secret_123
